# ==========================================
# 核心设置
# ==========================================
theme: jekyll-theme-chirpy
lang: zh-CN
timezone: Asia/Shanghai

title: "ywx920 · 技术笔记"
tagline: 嵌入式开发与边缘 AI 实践
description: >-
  记录 GD32/STM32 固件、工业通信、嵌入式 Linux、RK3588 视觉和本地 AI 应用的项目实践。

# GitHub Pages 项目站点：baseurl 与仓库名称保持一致
url: "https://ywx920.github.io"
baseurl: "/web-personal-blog"

github:
  username: ywx920

social:
  name: ywx920
  email: ywx20@foxmail.com
  links:
    - https://github.com/ywx920 # 第一个是版权链接

# ==========================================
# 插件与功能（已关闭未配置项，防止报错）
# ==========================================

# 站点代码标识
avatar: /assets/img/avatar.svg

# 关闭未配置的评论系统
comments:
  active: false 

# 开启目录
toc: true

# PWA 设置
pwa:
  enabled: false
  cache:
    enabled: false

paginate: 10

collections:
  tabs:
    output: true
    sort_by: order

# ==========================================
# 默认布局配置
# ==========================================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# ==========================================
# 排除项
# ==========================================
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - "package*.json"
  - vendor

# Explicit archive routes for the custom reading layouts.
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/
